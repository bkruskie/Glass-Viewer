name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Prepare APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/*.apk UniversalMedia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: universal-media-debug-apk
          path: UniversalMedia.apk

      # Every build of main becomes the "Latest" release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/UniversalMedia.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Universal Media ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          make_latest: true
          files: UniversalMedia.apk
          body: |
            Test build ${{ github.run_number }} from commit ${{ github.sha }}.

            Install: download UniversalMedia.apk on your phone and open it.
            Samsung phones: turn off Settings → Security and privacy → Auto Blocker while installing.
